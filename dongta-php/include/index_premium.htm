<?php
/**
 * 프리미엄 구인 목록 (index 중앙 상단 배너 아래)
 * API: GET /api/v1/recruit/notices/premium/   (AllowAny)
 */
if (!function_exists('dongta_api_get')) {
    include_once(dirname(__FILE__) . '/api_helper.php');
}

$items = dongta_api_get('/recruit/notices/premium/', [], 300);
if (!$items) $items = [];
// 최대 3건 표시
$items = array_slice($items, 0, 3);
?>
<table width='390' border='0' cellspacing='0' cellpadding='0'>
<?php if ($items): foreach ($items as $row):
    $company = isset($row['company_name']) ? $row['company_name'] : '';
    $title   = isset($row['title'])        ? $row['title']        : '';
    $type    = isset($row['employment_type']) ? '[' . $row['employment_type'] . '] ' : '';
?>
  <tr>
    <td width='5'>&nbsp;</td>
    <td width='7'><img src='images/icon_premium.gif' width='7' height='7' /></td>
    <td>
      <a href='/recruit/JobofferList.phtml?cmd=read&data_idx=<?= (int)$row['id'] ?>'
         style='font-size:11px; color:#c00; font-weight:bold;'>
        <?= htmlspecialchars($type . dongta_cut_str($title, 50), ENT_QUOTES, 'UTF-8') ?>
      </a>
      <?php if ($company): ?>
        <span style='font-size:10px; color:#666;'>(<?= htmlspecialchars($company, ENT_QUOTES, 'UTF-8') ?>)</span>
      <?php endif; ?>
    </td>
    <td width='40' style='font-size:10px; color:#999;'>
      <?= dongta_date_label($row['created_at']) ?>
    </td>
    <td width='5'>&nbsp;</td>
  </tr>
<?php endforeach; else: ?>
  <tr><td colspan='5' style='font-size:11px; color:#999; padding:2px 5px;'>등록된 프리미엄 구인이 없습니다.</td></tr>
<?php endif; ?>
</table>
