<?php
/**
 * 공지사항 목록 (index 좌측 상단)
 * API: GET /api/v1/board/posts/?category=NOTICE&limit=5
 */
if (!function_exists('dongta_api_get')) {
    include_once(dirname(__FILE__) . '/api_helper.php');
}

$items = dongta_api_get('/board/posts/', ['category' => 'NOTICE', 'limit' => 5], 600);
?>
<table width='280' border='0' cellspacing='0' cellpadding='0'>
<?php if ($items): foreach ($items as $row): ?>
  <tr>
    <td width='3'>&nbsp;</td>
    <td width='7'><img src='images/jum_gray.gif' width='2' height='2' /></td>
    <td>
      <a href='/board/BBS.php3?cmd=read&db=notice&data_idx=<?= (int)$row['id'] ?>'
         style='font-size:11px; color:#333;'>
        <?= htmlspecialchars(dongta_cut_str($row['title'], 56), ENT_QUOTES, 'UTF-8') ?>
      </a>
    </td>
    <td width='35' style='font-size:10px; color:#999; text-align:right;'>
      <?= dongta_date_label($row['created_at']) ?>
    </td>
    <td width='5'>&nbsp;</td>
  </tr>
<?php endforeach; else: ?>
  <tr><td colspan='5' style='font-size:11px; color:#999; padding:3px;'>공지사항이 없습니다.</td></tr>
<?php endif; ?>
</table>
