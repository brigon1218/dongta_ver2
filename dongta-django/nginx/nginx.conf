# nginx/nginx.conf
# 하이브리드 운영 설정 (Phase 1-2)
# /api/v1/* → Django (localhost:8000)
# /*        → PHP Apache (localhost:80)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로그 형식
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip 압축
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ---------------------------------------------------------------------------
    # Rate Limiting 정의
    # ---------------------------------------------------------------------------
    # 로그인 API: IP당 5req/min (AUTH_003 에러 코드와 연동)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # 일반 API: IP당 100req/min
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # 전역 요청 제한: IP당 200req/min
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=200r/m;

    limit_req_status 429;
    limit_conn_status 429;

    # =============================================================================
    # Django Upstream (Canary 배포 지원)
    # =============================================================================
    # Stable: 기존 운영 중인 인스턴스들
    upstream django_stable {
        server localhost:8000 weight=1;
        server localhost:8001 weight=1;
        server localhost:8002 weight=1;
        keepalive 32;
    }

    # Canary: 새로운 배포 버전 (초기 가중치 0)
    upstream django_canary {
        server localhost:8003 weight=1;
        keepalive 32;
    }

    # 통합 upstream (가중치 기반 라우팅)
    # Upstream backends (Simple configuration for production)
    upstream django_backend {
        # Main Django application server
        # localhost:8000으로 직접 접근 (Nginx와 Django가 같은 호스트)
        server localhost:8000;
        keepalive 32;
    }

    # PHP Apache upstream
    upstream php_apache {
        server localhost:80;
        keepalive 32;
    }

    # =============================================================================
    # Production Server Block: dongta.theuit.info (Django 전용)
    # SSL 인증서: Cloudflare Origin Certificate (/etc/nginx/certs/)
    # =============================================================================
    server {
        listen 443 ssl http2;
        server_name dongta.theuit.info www.dongta.theuit.info;

        # SSL 인증서 (Cloudflare Origin Certificate)
        # 파일 위치: dongta-django/nginx/certs/origin.crt, private.key
        ssl_certificate /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/private.key;

        # TLS 프로토콜 및 암호화
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # 보안 헤더
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 전역 Rate Limit
        limit_req zone=global_limit burst=50 nodelay;

        # Health Check (모니터링 및 Docker HEALTHCHECK)
        location = /api/v1/health/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host "dongta.theuit.info";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # -------------------------------------------
        # 로그인 API: Rate Limit (5req/min per IP)
        # -------------------------------------------
        location = /api/v1/auth/login/ {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host "dongta.theuit.info";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------
        # Django API 라우팅: /api/v1/* → Django:8000
        # -------------------------------------------
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host "dongta.theuit.info";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Django Admin
        location /admin/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host "dongta.theuit.info";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Django 정적 파일 (collectstatic 결과물)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Django 미디어 파일
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # -------------------------------------------
        # Production: 모든 트래픽 → Django
        # (PHP 라우팅 제거 - 완전 전환)
        # -------------------------------------------
        location / {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Host "dongta.theuit.info";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTP → HTTPS 리다이렉트 (Production)
    server {
        listen 80;
        server_name dongta.theuit.info www.dongta.theuit.info;
        return 301 https://$host$request_uri;
    }

