# Cloudflare SSL/TLS 설정
# Full Strict SSL 모드에서 무한 리다이렉션을 방지하는 Nginx 설정

# Cloudflare IP 범위 (참고: 가장 최신 IP 범위 확인)
# https://www.cloudflare.com/ips/

upstream dongta_app {
    server localhost:8000;
}

# HTTP 요청 처리 (Cloudflare 외부의 직접 접근)
server {
    listen 80;
    server_name dongta.theuit.info www.dongta.theuit.info;

    # Cloudflare의 HTTPS 요청은 여기 오지 않음
    # 직접 HTTP 접근만 처리
    return 301 https://$server_name$request_uri;
}

# HTTPS 요청 처리 (Cloudflare Full Strict SSL)
server {
    listen 443 ssl http2;
    server_name dongta.theuit.info www.dongta.theuit.info;

    # SSL 인증서 설정
    # Let's Encrypt를 권장
    ssl_certificate /etc/letsencrypt/live/dongta.theuit.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dongta.theuit.info/privkey.pem;

    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS 헤더 (Cloudflare를 통한 접근)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare 헤더 처리
    add_header X-Cloudflare-Ray $http_cf_ray always;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-Visitor $http_cf_visitor;

    # 정적 파일 캐싱
    location /static/ {
        alias /app/dongta-django/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/dongta-django/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 헬스 체크 엔드포인트
    location /health/ {
        proxy_pass http://dongta_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # API 엔드포인트
    location / {
        proxy_pass http://dongta_app;

        # Host 헤더
        proxy_set_header Host $host;

        # IP 주소
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 프로토콜 (중요: Cloudflare에서 이미 HTTPS)
        proxy_set_header X-Forwarded-Proto https;

        # Cloudflare 관련 헤더
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Visitor $http_cf_visitor;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header Forwarded "for=$proxy_add_x_forwarded_for;proto=https";

        # 프록시 설정
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # WebSocket 지원 (선택사항)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 에러 페이지
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Cloudflare Flexible SSL 호환 설정 (권장하지 않음)
# 만약 Flexible SSL을 사용해야 하는 경우:
