version: '3.9'

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  restart: always
  env_file:
    - .env.prod
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *common
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --worker-class gthread --timeout 30 --access-logfile - --error-logfile -
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  celery-sync:
    <<: *common
    command: celery -A config worker -l info -Q sync -c 2 --max-tasks-per-child 100
    deploy:
      replicas: 2

  celery-payment:
    <<: *common
    command: celery -A config worker -l info -Q payment -c 1
    deploy:
      replicas: 1

  celery-beat:
    <<: *common
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  nginx:
    image: nginx:stable-alpine
    container_name: dongta-nginx-prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: always

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: dongta-prometheus-prod
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../config/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_prod_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - web
    restart: always

  # Grafana - Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: dongta-grafana-prod
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_prod_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

  # AlertManager - Alert Routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: dongta-alertmanager-prod
    volumes:
      - ../config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
  static_volume:
  media_volume:
  prometheus_prod_data:
  grafana_prod_data:
