<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #1a1a1a; color: white; padding: 20px; text-align: center; border-radius: 5px; }
        .content { padding: 20px; background-color: #f9f9f9; border-radius: 5px; }
        .button { display: inline-block; padding: 12px 30px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
        .footer { text-align: center; color: #666; font-size: 12px; margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>비밀번호 재설정</h1>
        </div>

        <div class="content">
            <p>안녕하세요, {{ member_name }}님!</p>

            <p>동타114 계정의 비밀번호를 재설정해주세요.</p>

            <p>아래 버튼을 클릭하면 비밀번호 재설정 페이지로 이동합니다.</p>

            <div style="text-align: center;">
                <a href="{{ reset_url }}" class="button">비밀번호 재설정</a>
            </div>

            <p style="color: #999; font-size: 12px; margin-top: 20px;">
                또는 아래 링크를 복사하여 브라우저에 붙여넣으세요:<br>
                <span style="word-break: break-all;">{{ reset_url }}</span>
            </p>

            <p style="color: #999; font-size: 12px;">
                ⚠️ 이 링크는 {{ expires_hours }}시간 후에 만료됩니다.<br>
                요청하지 않은 이메일이라면 무시하셔도 됩니다.
            </p>
        </div>

        <div class="footer">
            <p>&copy; 2026 dongta.com. All rights reserved.</p>
            <p>이 이메일은 자동으로 생성된 메일입니다. 회신하지 마세요.</p>
        </div>
    </div>
</body>
</html>
