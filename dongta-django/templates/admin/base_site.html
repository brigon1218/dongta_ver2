{% extends "admin/base.html" %}
{% load i18n static %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | 동타 관리자{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}">
    <span style="display:inline-flex;align-items:center;gap:8px;">
      <span style="font-size:20px;">🏢</span>
      <span>동타 관리자</span>
    </span>
  </a>
</h1>
{% endblock %}

{% block nav-global %}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
/* ── 폰트 ── */
body {
  font-family: 'Segoe UI', -apple-system, 'Noto Sans KR', sans-serif !important;
}

/* ── 헤더 ── */
#header {
  background: linear-gradient(135deg, #1e4f6b 0%, #2d6a8a 100%) !important;
  box-shadow: 0 2px 8px rgba(0,0,0,.2) !important;
}
#site-name a {
  color: #fff !important;
  font-weight: 700 !important;
  font-size: 16px !important;
  text-decoration: none !important;
}
#user-tools, #user-tools a, #user-tools a:visited {
  color: rgba(255,255,255,.9) !important;
  font-size: 12px !important;
}
#user-tools a {
  border-bottom: none !important;
  padding: 3px 8px !important;
  background: rgba(255,255,255,.12) !important;
  border-radius: 12px !important;
  margin-left: 4px !important;
  text-decoration: none !important;
  transition: background .2s !important;
}
#user-tools a:hover {
  background: rgba(255,255,255,.25) !important;
}

/* ── 테마 토글 버튼 숨기기 ── */
.theme-toggle { display: none !important; }

/* ── 브레드크럼 ── */
div.breadcrumbs {
  background: #f8fafc !important;
  border-bottom: 1px solid #dde3ea !important;
  color: #888 !important;
  font-size: 12px !important;
  padding: 9px 24px !important;
}
div.breadcrumbs a { color: #2d6a8a !important; }

/* ── 사이드바 (색상만, 구조 유지) ── */
#nav-sidebar {
  background: #fff !important;
  border-right: 1px solid #e8edf2 !important;
}
#nav-sidebar .module caption,
#nav-sidebar .module > h2 {
  background: #f0f4f8 !important;
  color: #2d6a8a !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  letter-spacing: .06em !important;
  text-transform: uppercase !important;
  padding: 8px 14px !important;
}
#nav-sidebar .module th,
#nav-sidebar .module td {
  padding: 0 !important;
}
#nav-sidebar .module th a,
#nav-sidebar .module td a {
  display: block !important;
  padding: 7px 16px !important;
  font-size: 13px !important;
  color: #2c3e50 !important;
  text-decoration: none !important;
  transition: background .15s !important;
  border-left: 3px solid transparent !important;
}
#nav-sidebar .module th a:hover,
#nav-sidebar .module td a:hover {
  background: #e8f4fd !important;
  color: #1e4f6b !important;
  border-left-color: #2d6a8a !important;
}
#nav-sidebar .current-model > a,
#nav-sidebar .current-app .section:link {
  background: #e8f4fd !important;
  color: #1e4f6b !important;
  border-left-color: #2d6a8a !important;
  font-weight: 600 !important;
}

/* ── 메인 콘텐츠 ── */
#content {
  background: #fff !important;
  border-radius: 8px !important;
  box-shadow: 0 1px 4px rgba(0,0,0,.07) !important;
  padding: 24px !important;
  margin: 12px !important;
}
#content h1 {
  font-size: 18px !important;
  font-weight: 700 !important;
  color: #1e3a4f !important;
  border-bottom: 2px solid #e8f0f7 !important;
  padding-bottom: 12px !important;
  margin-bottom: 20px !important;
}

/* ── 앱 모듈 카드 ── */
.app-index .module,
#content-main > .module {
  border: 1px solid #dde3ea !important;
  border-radius: 8px !important;
  overflow: hidden !important;
  margin-bottom: 16px !important;
  box-shadow: 0 1px 3px rgba(0,0,0,.05) !important;
}
.app-index .module caption,
#content-main > .module caption,
table.module caption {
  background: #2d6a8a !important;
  color: #fff !important;
  font-size: 12px !important;
  font-weight: 600 !important;
  padding: 9px 14px !important;
  text-align: left !important;
  letter-spacing: .02em !important;
}
.app-index .module caption a,
#content-main > .module caption a { color: rgba(255,255,255,.9) !important; }
.app-index .module table td,
#content-main > .module table td {
  padding: 8px 14px !important;
  font-size: 13px !important;
  border-bottom: 1px solid #f5f5f5 !important;
}
.app-index .module table tr:last-child td { border-bottom: none !important; }
.app-index .module td a { color: #2d6a8a !important; font-weight: 500 !important; }

/* ── 액션 링크 ── */
.addlink {
  color: #27ae60 !important;
  font-size: 11px !important;
  background: #eafaf1 !important;
  padding: 2px 7px !important;
  border-radius: 10px !important;
  font-weight: 600 !important;
  text-decoration: none !important;
}
.changelink {
  color: #2d6a8a !important;
  font-size: 11px !important;
  background: #e8f4fd !important;
  padding: 2px 7px !important;
  border-radius: 10px !important;
  font-weight: 600 !important;
  text-decoration: none !important;
}
.deletelink {
  color: #e74c3c !important;
  font-size: 11px !important;
  background: #fdecea !important;
  padding: 2px 7px !important;
  border-radius: 10px !important;
  font-weight: 600 !important;
}

/* ── 리스트 테이블 ── */
#result_list thead th {
  background: #f4f7fa !important;
  color: #7f8c8d !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
  letter-spacing: .05em !important;
  border-bottom: 2px solid #dde3ea !important;
  padding: 10px 12px !important;
}
#result_list thead th a,
#result_list thead th a:visited { color: #7f8c8d !important; }
#result_list thead th.sorted a { color: #2d6a8a !important; }
#result_list tbody tr { border-bottom: 1px solid #f0f3f6 !important; }
#result_list tbody tr:hover { background: #f8fafc !important; }
#result_list tbody td { padding: 10px 12px !important; font-size: 13px !important; }
#result_list tbody td a { color: #2d6a8a !important; font-weight: 500 !important; }

/* ── 버튼 ── */
.button, input[type="submit"]:not(.theme-toggle),
.submit-row input[type="submit"] {
  background: #2d6a8a !important;
  color: #fff !important;
  border: none !important;
  border-radius: 6px !important;
  padding: 8px 16px !important;
  font-size: 13px !important;
  font-weight: 600 !important;
  cursor: pointer !important;
  transition: background .2s !important;
}
.button:hover, input[type="submit"]:hover {
  background: #1e4f6b !important;
  color: #fff !important;
}
.submit-row {
  background: #f8fafc !important;
  border-top: 1px solid #dde3ea !important;
  padding: 12px 16px !important;
}

/* ── 폼 ── */
.form-row { border-bottom: 1px solid #f5f5f5 !important; padding: 12px 0 !important; }
label { color: #555 !important; font-size: 12px !important; font-weight: 600 !important; }
input[type="text"], input[type="email"], input[type="password"],
input[type="number"], input[type="url"], textarea, select {
  border: 1.5px solid #dde3ea !important;
  border-radius: 6px !important;
  padding: 7px 11px !important;
  font-size: 13px !important;
  background: #fafbfc !important;
  transition: border-color .2s !important;
}
input[type="text"]:focus, input[type="email"]:focus,
textarea:focus, select:focus {
  border-color: #2d6a8a !important;
  outline: none !important;
  box-shadow: 0 0 0 3px rgba(45,106,138,.10) !important;
}

/* ── 메시지 ── */
ul.messagelist li {
  border-radius: 6px !important;
  font-size: 13px !important;
  padding: 10px 14px !important;
  margin-bottom: 8px !important;
  border-left: 4px solid !important;
}
ul.messagelist li.success {
  background: #e8f5e9 !important;
  border-color: #27ae60 !important;
  color: #1b5e20 !important;
}
ul.messagelist li.warning {
  background: #fff8e1 !important;
  border-color: #f9a825 !important;
  color: #5d4037 !important;
}
ul.messagelist li.error {
  background: #fdecea !important;
  border-color: #e74c3c !important;
  color: #7f0000 !important;
}

/* ── 페이지네이션 ── */
.paginator {
  font-size: 12px !important;
  color: #7f8c8d !important;
  padding: 12px 0 !important;
}
.paginator a {
  padding: 3px 9px !important;
  border: 1px solid #dde3ea !important;
  border-radius: 5px !important;
  margin: 0 2px !important;
  color: #2d6a8a !important;
  text-decoration: none !important;
}
.paginator .this-page {
  background: #2d6a8a !important;
  color: #fff !important;
  border-color: #2d6a8a !important;
  padding: 3px 9px !important;
  border-radius: 5px !important;
  margin: 0 2px !important;
}

/* ── 필터 사이드바 ── */
#changelist-filter {
  background: #fff !important;
  border: 1px solid #dde3ea !important;
  border-radius: 8px !important;
}
#changelist-filter h2 {
  background: #2d6a8a !important;
  color: #fff !important;
  font-size: 12px !important;
  padding: 9px 14px !important;
  border-radius: 7px 7px 0 0 !important;
}
#changelist-filter h3 {
  font-size: 11px !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
  color: #7f8c8d !important;
  letter-spacing: .05em !important;
  padding: 10px 14px 4px !important;
}
#changelist-filter li a { font-size: 13px !important; color: #2d6a8a !important; }
#changelist-filter li.selected a { color: #1e4f6b !important; font-weight: 700 !important; }
</style>
{% endblock %}
