{% extends "admin/base_site.html" %}
{% load i18n %}

{% block extrastyle %}
{{ block.super }}
<style>
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin: 20px 0 28px;
}
@media (max-width: 1200px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .dashboard-grid { grid-template-columns: 1fr; } }

.stat-card {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,.10);
  padding: 20px 20px 16px;
  border-top: 4px solid #79aec8;
  position: relative;
  overflow: hidden;
}
.stat-card.c-blue   { border-top-color: #417690; }
.stat-card.c-green  { border-top-color: #28a745; }
.stat-card.c-orange { border-top-color: #e67e22; }
.stat-card.c-purple { border-top-color: #8e44ad; }

.stat-card__icon {
  position: absolute;
  top: 14px;
  right: 16px;
  font-size: 28px;
  opacity: .15;
}
.stat-card__label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #888;
  margin: 0 0 10px;
}
.stat-card__rows { display: flex; flex-direction: column; gap: 6px; }
.stat-card__row  { display: flex; justify-content: space-between; align-items: baseline; }
.stat-card__name { font-size: 12px; color: #555; }
.stat-card__val  { font-size: 20px; font-weight: 700; color: #213547; line-height: 1; }
.stat-card__val.small { font-size: 14px; }
.stat-card__sub  { font-size: 11px; color: #999; margin-top: 2px; }

.status-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.status-badge.ok  { background: #e8f5e9; color: #2e7d32; }
.status-badge.err { background: #ffebee; color: #c62828; }
.status-badge.na  { background: #f5f5f5; color: #9e9e9e; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.status-dot.ok  { background: #2e7d32; }
.status-dot.err { background: #c62828; }
.status-dot.na  { background: #9e9e9e; }

.dashboard-title {
  font-size: 13px; font-weight: 600; color: #417690;
  margin: 0 0 4px; letter-spacing: .03em;
}
.dashboard-updated { font-size: 11px; color: #bbb; margin: 0 0 16px; }

.skeleton {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 4px; height: 20px; width: 60%;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
{% endblock %}

{% block content %}
<p class="dashboard-title">플랫폼 현황</p>
<p class="dashboard-updated" id="dash-updated">불러오는 중...</p>

<div class="dashboard-grid">

  <!-- 회원 -->
  <div class="stat-card c-blue">
    <span class="stat-card__icon">👥</span>
    <p class="stat-card__label">회원</p>
    <div class="stat-card__rows" id="card-users">
      <div class="skeleton"></div>
    </div>
  </div>

  <!-- 사업장 -->
  <div class="stat-card c-orange">
    <span class="stat-card__icon">🏢</span>
    <p class="stat-card__label">사업장</p>
    <div class="stat-card__rows" id="card-businesses">
      <div class="skeleton"></div>
    </div>
  </div>

  <!-- 결제 -->
  <div class="stat-card c-green">
    <span class="stat-card__icon">💳</span>
    <p class="stat-card__label">결제 (오늘)</p>
    <div class="stat-card__rows" id="card-payments">
      <div class="skeleton"></div>
    </div>
  </div>

  <!-- 시스템 -->
  <div class="stat-card c-purple">
    <span class="stat-card__icon">⚙️</span>
    <p class="stat-card__label">시스템 상태</p>
    <div id="card-system">
      <div class="skeleton"></div>
    </div>
  </div>

</div>

{{ block.super }}

<script>
(function () {
  function row(name, val, unit) {
    return '<div class="stat-card__row">'
      + '<span class="stat-card__name">' + name + '</span>'
      + '<span class="stat-card__val">' + val + '<span style="font-size:11px;font-weight:400;color:#999;margin-left:2px;">' + (unit || '') + '</span></span>'
      + '</div>';
  }
  function badge(label, state) {
    var cls = state === 'ok' ? 'ok' : (state === 'N/A' ? 'na' : 'err');
    var dot  = '<span class="status-dot ' + cls + '"></span>';
    return '<span class="status-badge ' + cls + '">' + dot + label + '</span>';
  }
  function fmt(n) { return (n === 'N/A' || n === undefined) ? 'N/A' : Number(n).toLocaleString(); }

  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 8000);

  var csrfToken = document.cookie.split(';')
    .map(function(c){ return c.trim(); })
    .filter(function(c){ return c.startsWith('csrftoken='); })
    .map(function(c){ return c.split('=')[1]; })[0] || '';

  fetch('/admin/dashboard-stats/', {
    signal: ctrl.signal,
    credentials: 'same-origin',
    headers: { 'X-CSRFToken': csrfToken }
  })
    .then(function (r) {
      clearTimeout(timer);
      if (!r.ok) {
        throw new Error('HTTP ' + r.status + ' ' + r.statusText);
      }
      return r.json();
    })
    .then(function (data) {
      console.log('Dashboard stats loaded:', data);
      var u  = data.users      || {};
      var b  = data.businesses || {};
      var p  = data.payments   || {};
      var po = data.posts      || {};
      var s  = data.system     || {};

      document.getElementById('card-users').innerHTML =
        row('전체 회원', fmt(u.total), '명') +
        row('활성 회원', fmt(u.active), '명') +
        row('오늘 신규', fmt(u.today_new), '명');

      document.getElementById('card-businesses').innerHTML =
        row('전체 사업장', fmt(b.total), '개') +
        row('승인 대기', fmt(b.pending_approval), '개');

      document.getElementById('card-payments').innerHTML =
        row('오늘 건수', fmt(p.today_count), '건') +
        row('오늘 금액', fmt(p.today_amount), '원');

      // card-posts가 없을 수 있으므로 체크
      var postCard = document.getElementById('card-posts');
      if (postCard) {
        postCard.innerHTML =
          row('전체 게시글', fmt(po.total), '개') +
          row('오늘 신규', fmt(po.today_new), '개');
      }

      document.getElementById('card-system').innerHTML =
        '<div class="status-row">'
        + badge('DB',     s.database)
        + badge('Redis',  s.cache)
        + badge('Celery', s.celery)
        + '</div>';

      var now = new Date();
      document.getElementById('dash-updated').textContent =
        '마지막 업데이트: ' + now.toLocaleTimeString('ko-KR');
    })
    .catch(function (err) {
      clearTimeout(timer);
      console.error('Dashboard fetch error:', err);
      var errorMsg = '<span style="font-size:12px;color:#c62828;">⚠️ 데이터 로드 오류</span><div style="font-size:10px;color:#999;margin-top:4px;">' +
        (err.message || '연결 실패') + '</div>';
      ['card-users','card-businesses','card-payments','card-posts','card-system'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.innerHTML = errorMsg;
      });
      document.getElementById('dash-updated').innerHTML =
        '업데이트 실패 - <a href="javascript:location.reload();" style="color:#417690;">새로고침</a>';
    });
})();
</script>
{% endblock %}
