{% extends "admin/base_site.html" %}
{% load i18n admin_urls static admin_list_filter %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* 검색 및 필터 영역 */
  .changelist-container {
    display: flex;
    gap: 20px;
  }

  #changelist-filter {
    float: none !important;
    width: 220px !important;
    flex-shrink: 0;
  }

  #changelist {
    flex: 1;
  }

  /* 검색 폼 개선 */
  #toolbar {
    background: transparent !important;
    padding: 0 0 16px 0 !important;
    border: none !important;
  }

  #toolbar form {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    flex-wrap: wrap !important;
  }

  #toolbar input[type="text"],
  #toolbar input[type="search"] {
    flex: 1 !important;
    min-width: 200px !important;
    padding: 8px 12px !important;
    border: 1px solid #dde3ea !important;
    border-radius: 6px !important;
    font-size: 13px !important;
    background: #fff !important;
  }

  #toolbar input[type="submit"] {
    background: #2d6a8a !important;
    color: #fff !important;
    border: none !important;
    border-radius: 6px !important;
    padding: 8px 16px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    transition: background .2s !important;
  }

  #toolbar input[type="submit"]:hover {
    background: #1e4f6b !important;
  }

  #toolbar label {
    font-size: 13px !important;
    color: #555 !important;
    font-weight: 600 !important;
  }

  /* 필터 스타일 */
  #changelist-filter h2 {
    font-size: 13px !important;
    font-weight: 700 !important;
    color: #2d6a8a !important;
    border-bottom: 2px solid #e8f0f7 !important;
    padding-bottom: 10px !important;
    margin-bottom: 12px !important;
  }

  #changelist-filter .module h3 {
    font-size: 12px !important;
    font-weight: 700 !important;
    color: #555 !important;
    text-transform: uppercase !important;
    letter-spacing: .04em !important;
    margin-bottom: 8px !important;
  }

  #changelist-filter ul {
    list-style: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  #changelist-filter li {
    list-style: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  #changelist-filter li a {
    display: block !important;
    padding: 6px 10px !important;
    color: #555 !important;
    text-decoration: none !important;
    border-radius: 4px !important;
    transition: all .15s !important;
    font-size: 13px !important;
  }

  #changelist-filter li a:hover {
    background: #e8f4fd !important;
    color: #2d6a8a !important;
  }

  #changelist-filter li.selected a {
    background: #dceaf7 !important;
    color: #1e4f6b !important;
    font-weight: 600 !important;
  }
</style>
{% endblock %}
