version: '3.9'

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  restart: always
  env_file:
    - .env.staging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dongta_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: dongtadb_test
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dongta_user -d dongtadb_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

  web:
    <<: *common
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --worker-class gthread --timeout 30 --access-logfile - --error-logfile -
    expose:
      - "8000"
    ports:
      - "8001:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  celery-sync:
    <<: *common
    command: celery -A config worker -l info -Q sync -c 1 --max-tasks-per-child 50

  celery-payment:
    <<: *common
    command: celery -A config worker -l info -Q payment -c 1

  celery-beat:
    <<: *common
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_staging_volume:/app/staticfiles
      - media_staging_volume:/app/media
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - web
    environment:
      - DOMAIN=dongta.theuit.info

volumes:
  postgres_staging_data:
  redis_staging_data:
  static_staging_volume:
  media_staging_volume:
