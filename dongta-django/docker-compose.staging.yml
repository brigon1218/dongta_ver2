version: '3.9'

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  restart: always
  env_file:
    - .env.staging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dongta_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: dongtadb_test
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dongta_user -d dongtadb_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

  web:
    <<: *common
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --worker-class gthread --timeout 30 --access-logfile - --error-logfile -
    expose:
      - "8000"
    ports:
      - "8001:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  celery-sync:
    <<: *common
    command: celery -A config worker -l info -Q sync -c 1 --max-tasks-per-child 50

  celery-payment:
    <<: *common
    command: celery -A config worker -l info -Q payment -c 1

  celery-beat:
    <<: *common
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_staging_volume:/app/staticfiles
      - media_staging_volume:/app/media
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - web
    environment:
      - DOMAIN=dongta.theuit.info

  # Prometheus - 메트릭 수집 및 저장
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../config/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_staging_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"  # 외부 직접 접근 차단, SSH 터널 또는 Nginx 프록시 경유
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - web
    restart: always

  # Grafana - 메트릭 시각화
  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"  # 외부 직접 접근 차단, SSH 터널 또는 Nginx 프록시 경유
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_staging_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

  # Alertmanager - 알림 라우팅 (Slack/Email)
  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ../config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"  # 외부 직접 접근 차단
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    restart: always

  # PostgreSQL Exporter - DB 메트릭 수집
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://dongta_user:test_password@db:5432/dongtadb_test?sslmode=disable"
    depends_on:
      - db
    restart: always

  # Redis Exporter - Redis 메트릭 수집
  redis-exporter:
    image: oliver006/redis_exporter:latest
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    restart: always

  # Node Exporter - 시스템 리소스 메트릭
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: always

volumes:
  postgres_staging_data:
  redis_staging_data:
  static_staging_volume:
  media_staging_volume:
  prometheus_staging_data:
  grafana_staging_data:
