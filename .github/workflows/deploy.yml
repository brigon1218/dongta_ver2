name: Deploy to Production

on:
  push:
    branches:
      - main
      - production

env:
  REGISTRY: docker.io
  IMAGE_NAME: dongta-django

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint & Test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dongta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dongta-django/requirements.txt
          pip install flake8 pytest pytest-django pytest-cov

      - name: Lint with flake8
        run: |
          cd dongta-django
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run pytest
        env:
          DEBUG: 'False'
          SECRET_KEY: 'test-secret-key'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/dongta_test'
          REDIS_URL: 'redis://localhost:6379/0'
          ALLOWED_HOSTS: '127.0.0.1,localhost'
        run: |
          cd dongta-django
          pytest --cov=apps --cov-report=xml --cov-report=term

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    name: Build Docker Image
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./dongta-django
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dongta-django:latest
            ${{ secrets.DOCKER_USERNAME }}/dongta-django:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/ubuntu/work_01/dongta-django

            # 최신 이미지 당겨오기
            docker-compose -f docker-compose.prod.yml pull

            # 환경변수 파일 생성/업데이트
            cat > .env.prod << EOF
            DEBUG=False
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_TRACES_SAMPLE_RATE=0.1
            DANAL_CPID=${{ secrets.DANAL_CPID }}
            DANAL_API_KEY=${{ secrets.DANAL_API_KEY }}
            LOG_FILE_PATH=/var/log/django/dongta.log
            EOF

            # Docker Compose로 배포
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d

            # 마이그레이션 실행
            docker-compose -f docker-compose.prod.yml exec -T web python manage.py migrate

            # 정적 파일 수집
            docker-compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput

            # 헬스체크
            sleep 10
            docker-compose -f docker-compose.prod.yml ps

      - name: Notify Slack (Success)
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ Production Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deploy Status*: ✅ Success\n*Branch*: ${{ github.ref }}\n*Commit*: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ Production Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deploy Status*: ❌ Failed\n*Branch*: ${{ github.ref }}\n*Commit*: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
